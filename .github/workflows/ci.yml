name: OctoBot Arduino IDE and Flutter verification

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  gait-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run pure C++ gait tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            src/GaitEngine.cpp tests/native_gait_test.cpp \
            -o /tmp/octobot-gait-test
          /tmp/octobot-gait-test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Static analysis
        working-directory: flutter
        run: flutter analyze --no-fatal-infos
      - name: Widget and telemetry tests
        working-directory: flutter
        run: flutter test

  esp32-arduino-sketch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino board core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install Arduino libraries (pinned)
        run: |
          arduino-cli lib install "Adafruit PWM Servo Driver Library@3.0.3" "VL53L0X@1.3.1" "ArduinoJson@7.4.3"
          mkdir -p "$HOME/Arduino/libraries"
          git clone --quiet --depth 1 --branch v3.6.0 https://github.com/ESP32Async/ESPAsyncWebServer.git "$HOME/Arduino/libraries/ESPAsyncWebServer"
          git clone --quiet --depth 1 --branch v3.3.2 https://github.com/ESP32Async/AsyncTCP.git "$HOME/Arduino/libraries/AsyncTCP"
      - name: Compile real OctoBot.ino in Arduino IDE layout
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all .
      - name: Compile standalone Arduino calibration sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32 tools/servo_calibrator
